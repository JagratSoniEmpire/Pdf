                </div>

                {/* Financial Summary Table */}
                <div>
                  <h3 className="text-sm font-extrabold text-brand-orange uppercase tracking-wider border-b pb-1 mb-2">3. Project Cost & Financial Breakdown</h3>
                  <div className="border border-slate-300 rounded-lg overflow-hidden">
                    <table className="w-full text-xs">
                      <thead className="bg-amber-500 text-white font-bold text-left">
                        <tr>
                          <th className="py-2.5 px-3">Commercial Description</th>
                          <th className="py-2.5 px-3 text-right">Amount (INR)</th>
                          <th className="py-2.5 px-3 text-right">Remarks</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        <tr>
                          <td className="py-2.5 px-3 font-medium text-slate-800">System Rate per kW</td>
                          <td className="py-2.5 px-3 text-right font-bold">{formatINR(quote.ratePerKw)}</td>
                          <td className="py-2.5 px-3 text-right text-slate-500">Rate / kW</td>
                        </tr>
                        <tr className="bg-slate-50/70">
                          <td className="py-2.5 px-3 font-bold text-slate-900">Total Project Base Cost</td>
                          <td className="py-2.5 px-3 text-right font-bold text-slate-900">{formatINR(quote.totalProjectCost)}</td>
                          <td className="py-2.5 px-3 text-right text-slate-500">For {quote.capacityKw} kW</td>
                        </tr>
                        <tr>
                          <td className="py-2.5 px-3 font-semibold text-emerald-700">Estimated Government CFA / Subsidy</td>
                          <td className="py-2.5 px-3 text-right font-bold text-emerald-700">- {formatINR(quote.subsidy)}</td>
                          <td className="py-2.5 px-3 text-right text-emerald-700">Direct Subsidy Benefit</td>
                        </tr>
                        <tr className="bg-amber-50 font-black text-slate-900 border-t-2 border-brand-500">
                          <td className="py-3 px-3 text-sm text-brand-orange">Net Landing Cost to Client</td>
                          <td className="py-3 px-3 text-right text-base font-black text-brand-orange">{formatINR(quote.netLandingCost)}</td>
                          <td className="py-3 px-3 text-right text-xs font-bold text-slate-700">Net Payable</td>
                        </tr>
                        <tr>
                          <td className="py-2 px-3 text-slate-600">Solar Bi-directional Net Metering Charge</td>
                          <td className="py-2 px-3 text-right text-slate-700">{formatINR(quote.meterCharge)}</td>
                          <td className="py-2 px-3 text-right text-slate-500 font-semibold">{quote.meterChargeType}</td>
                        </tr>
                        <tr>
                          <td className="py-2 px-3 text-slate-600">Statutory DISCOM Registration Charges</td>
                          <td className="py-2 px-3 text-right text-slate-700 font-semibold">{quote.registrationCharges}</td>
                          <td className="py-2 px-3 text-right text-slate-500">Standard Scope</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <PdfPageFooter company={company} pageNumber={2} totalPages={totalPages} />
          </div>

          {/* PAGE 3: TECHNICAL BOM & ACTIVITIES */}
          <div className="pdf-page page-break">
            <div>
              <PdfPageHeader company={company} quoteNumber={quote.quotationNumber} />
              
              <div className="space-y-6">
                <div>
                  <h3 className="text-sm font-extrabold text-brand-orange uppercase tracking-wider border-b pb-1 mb-2">4. Bill of Materials & Technical Specifications</h3>
                  <table className="w-full text-[10px] border border-slate-200">
                    <thead className="bg-slate-100 font-bold uppercase text-slate-700 border-b">
                      <tr>
                        <th className="py-1.5 px-2 text-center w-8">SN</th>
                        <th className="py-1.5 px-2">Description</th>
                        <th className="py-1.5 px-2 text-center w-12">Unit</th>
                        <th className="py-1.5 px-2 text-center w-14">Qty</th>
                        <th className="py-1.5 px-2">Specification</th>
                        <th className="py-1.5 px-2">Manufacturer / Make</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {quote.materials.map((m, idx) => (
                        <tr key={idx} className={idx % 2 === 1 ? 'bg-slate-50/50' : ''}>
                          <td className="py-1.5 px-2 text-center font-bold text-slate-500">{idx + 1}</td>
                          <td className="py-1.5 px-2 font-semibold text-slate-800">{m.desc}</td>
                          <td className="py-1.5 px-2 text-center text-slate-600">{m.unit}</td>
                          <td className="py-1.5 px-2 text-center font-bold text-slate-900">{m.qty}</td>
                          <td className="py-1.5 px-2 text-slate-700">{m.spec}</td>
                          <td className="py-1.5 px-2 text-slate-700">{m.make}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div>
                  <h3 className="text-sm font-extrabold text-brand-orange uppercase tracking-wider border-b pb-1 mb-2">5. Services & Turnkey Scope</h3>
                  <table className="w-full text-[10px] border border-slate-200">
                    <thead className="bg-slate-100 font-bold uppercase text-slate-700 border-b">
                      <tr>
                        <th className="py-1.5 px-2 text-center w-8">SN</th>
                        <th className="py-1.5 px-2 w-32">Activity / Scope</th>
                        <th className="py-1.5 px-2">Details of Execution</th>
                        <th className="py-1.5 px-2 text-right w-28">Duration / Term</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {quote.services.map((s, idx) => (
                        <tr key={idx} className={idx % 2 === 1 ? 'bg-slate-50/50' : ''}>
                          <td className="py-1.5 px-2 text-center font-bold text-slate-500">{idx + 1}</td>
                          <td className="py-1.5 px-2 font-semibold text-slate-800">{s.activity}</td>
                          <td className="py-1.5 px-2 text-slate-700">{s.details}</td>
                          <td className="py-1.5 px-2 text-right font-medium text-amber-700">{s.duration}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <PdfPageFooter company={company} pageNumber={3} totalPages={totalPages} />
          </div>

          {/* PAGE 4: COMMERCIAL TERMS & BANKING & DISCLAIMER */}
          <div className="pdf-page page-break">
            <div>
              <PdfPageHeader company={company} quoteNumber={quote.quotationNumber} />
              
              <div className="space-y-4">
                <div>
                  <h3 className="text-xs font-extrabold text-brand-orange uppercase tracking-wider border-b pb-1 mb-2">6. Commercial Terms & Conditions</h3>
                  <div className="grid grid-cols-2 gap-x-4 gap-y-2 text-[9px] leading-tight text-slate-700">
                    {quote.terms.filter(t => t.enabled !== false).map((t, idx) => (
                      <div key={idx} className="space-y-0.5">
                        <strong className="text-slate-900">{idx + 1}. {t.title}:</strong> {t.text}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Banking Section */}
                {quote.banking?.showOnQuotation && (
                  <div className="bg-amber-50/60 border border-amber-300 rounded-lg p-3 text-[10px]">
                    <h4 className="font-extrabold text-slate-900 uppercase tracking-wider text-xs mb-1.5 flex items-center gap-1.5 text-brand-orange">
                      <span>Designated Banking Details for Remittance</span>
                    </h4>
                    <div className="grid grid-cols-3 gap-2">
                      <div><span className="text-slate-500">Bank Name:</span> <strong className="text-slate-800">{quote.banking.bankName}</strong></div>
                      <div><span className="text-slate-500">Branch:</span> <strong className="text-slate-800">{quote.banking.branch}</strong></div>
                      <div><span className="text-slate-500">IFSC Code:</span> <strong className="text-slate-900">{quote.banking.ifsc}</strong></div>
                      <div><span className="text-slate-500">Account Name:</span> <strong className="text-slate-800">{quote.banking.accountName}</strong></div>
                      <div className="col-span-2"><span className="text-slate-500">Account Number:</span> <strong className="text-slate-900">{quote.banking.accountNumber}</strong></div>
                    </div>
                  </div>
                )}

                {/* Disclaimer */}
                <div className="border-t pt-2">
                  <h4 className="text-[10px] font-bold text-slate-800 uppercase tracking-wider mb-1">Disclaimer & Legal Contract Notice</h4>
                  <p className="text-[8px] text-slate-500 leading-snug whitespace-pre-line text-justify">
                    {quote.disclaimer}
                  </p>
                </div>
              </div>
            </div>

            <PdfPageFooter company={company} pageNumber={4} totalPages={totalPages} />
          </div>

          {/* PAGE 5 (OPTIONAL): 25 COMPLETED PROJECT REFERENCES */}
          {quote.includeReferences && (
            <div className="pdf-page page-break">
              <div>
                <PdfPageHeader company={company} quoteNumber={quote.quotationNumber} />
                
                <div className="space-y-3">
                  <div>
                    <h3 className="text-sm font-extrabold text-brand-orange uppercase tracking-wider border-b pb-1 mb-1">Appendix: Select Completed Project References</h3>
                    <p className="text-[10px] text-slate-500 mb-2">Track record of industrial, institutional, and high-capacity solar installations executed by Blue Shield Energy.</p>
                  </div>

                  <table className="w-full text-[9px] border border-slate-200">
                    <thead className="bg-slate-100 font-bold uppercase text-slate-700 border-b">
                      <tr>
                        <th className="py-1 px-2 text-center w-8">SN</th>
                        <th className="py-1 px-2">Project / Customer Name</th>
                        <th className="py-1 px-2">Location</th>
                        <th className="py-1 px-2 text-center w-20">Capacity</th>
                        <th className="py-1 px-2">Project Classification</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {INITIAL_REFERENCES.map((r, idx) => (
                        <tr key={r.id} className={idx % 2 === 1 ? 'bg-slate-50/40' : ''}>
                          <td className="py-1 px-2 text-center font-bold text-slate-400">{idx + 1}</td>
                          <td className="py-1 px-2 font-bold text-slate-800">{r.client}</td>
                          <td className="py-1 px-2 text-slate-600">{r.location}</td>
                          <td className="py-1 px-2 text-center font-extrabold text-amber-700">{r.capacity}</td>
                          <td className="py-1 px-2 text-slate-600">{r.desc}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <PdfPageFooter company={company} pageNumber={5} totalPages={totalPages} />
            </div>
          )}

          {/* PAGE 6 (OPTIONAL): THANK YOU & CONTACT SIGN-OFF */}
          {quote.includeThankYouPage && (
            <div className="pdf-page">
              <div>
                <PdfPageHeader company={company} quoteNumber={quote.quotationNumber} />
                
                <div className="h-[520px] flex flex-col justify-center items-center text-center space-y-6">
                  <div className="w-20 h-20 bg-amber-100 text-brand-orange rounded-full flex items-center justify-center font-black text-2xl shadow-inner">
                    BSE
                  </div>

                  <div className="space-y-2">
                    <h2 className="text-3xl font-black text-slate-900 tracking-tight">THANK YOU!</h2>
                    <p className="text-sm font-semibold text-brand-orange uppercase tracking-widest">We look forward to powering your clean energy future</p>
                  </div>

                  <div className="max-w-md text-xs text-slate-600 leading-relaxed">
                    Blue Shield Energy is committed to delivering state-of-the-art engineering, highest generation output, and seamless commissioning across Gujarat and India.
                  </div>

                  <div className="p-6 bg-slate-50 border border-slate-200 rounded-2xl w-full max-w-md space-y-3 text-xs">
                    <div>
                      <span className="text-slate-500 uppercase text-[10px] font-bold block">For Order Confirmation & Site Readiness</span>
                      <strong className="text-slate-900 text-base">{company.mobile}</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 uppercase text-[10px] font-bold block">Official Communications</span>
                      <strong className="text-slate-900">{company.email}</strong>
                    </div>
                    <div>
                      <span className="text-slate-500 uppercase text-[10px] font-bold block">Corporate Web Portal</span>
                      <a href={`https://${company.website}`} className="text-brand-orange font-bold hover:underline">{company.website}</a>
                    </div>
                  </div>
                </div>
              </div>

              <PdfPageFooter company={company} pageNumber={totalPages} totalPages={totalPages} />
            </div>
          )}
        </div>
      );
    }

    // --- SUB-VIEW: PREVIEW WRAPPER ---
    function PreviewContainer({ quote, company, onEditBack, onDownload, isGenerating }) {
      return (
        <div className="space-y-4">
          <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex items-center justify-between no-print">
            <div className="flex items-center space-x-3">
              <button
                onClick={onEditBack}
                className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 transition"
              >
                <i data-lucide="arrow-left" className="w-4 h-4"></i>
                <span>Return to Editor</span>
              </button>
              <span className="text-xs text-slate-500">Displaying accurate multi-page A4 preview</span>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => window.print()}
                className="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 transition shadow"
              >
                <i data-lucide="printer" className="w-4 h-4"></i>
                <span>Print Document</span>
              </button>
              <button
                onClick={onDownload}
                disabled={isGenerating}
                className="bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-1.5 transition shadow"
              >
                <i data-lucide="download" className="w-4 h-4"></i>
                <span>{isGenerating ? 'Preparing PDF...' : 'Download File'}</span>
              </button>
            </div>
          </div>

          <div className="pdf-preview-container bg-slate-200 p-4 rounded-xl flex justify-center overflow-auto max-h-[85vh]">
            <PdfTemplate quote={quote} company={company} />
          </div>
        </div>
      );
    }

    // --- SUB-VIEW: COMPANY SETTINGS ---
    function CompanySettingsView({ company, setCompany }) {
      const [form, setForm] = useState(company);
      const [savedNotice, setSavedNotice] = useState(false);

      const handleSave = () => {
        setCompany(form);
        setSavedNotice(true);
        setTimeout(() => setSavedNotice(false), 3000);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setForm({ ...form, logoUrl: reader.result });
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm max-w-3xl mx-auto space-y-6">
          <div className="border-b pb-3 flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Company Identity & PDF Headers</h2>
              <p className="text-xs text-slate-500">Configures the automatic header, footer, and address across all quotation documents.</p>
            </div>
            {savedNotice && (
              <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                Settings Saved!
              </span>
            )}
          </div>

          <div className="space-y-4">
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Company Logo (Optional PNG/JPG/SVG)</label>
              <input
                type="file"
                accept="image/*"
                onChange={handleLogoUpload}
                className="text-xs text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-brand-orange hover:file:bg-amber-100"
              />
              {form.logoUrl && (
                <div className="mt-2 flex items-center gap-3">
                  <img src={form.logoUrl} alt="Logo preview" className="h-10 object-contain border p-1 rounded" />
                  <button
                    onClick={() => setForm({ ...form, logoUrl: "" })}
                    className="text-xs text-red-600 underline"
                  >
                    Remove Logo
                  </button>
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Company Name</label>
                <input
                  type="text"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Company Tagline</label>
                <input
                  type="text"
                  value={form.tagline}
                  onChange={(e) => setForm({ ...form, tagline: e.target.value })}
                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500"
                />
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Contact Mobile</label>
                <input
                  type="text"
                  value={form.mobile}
                  onChange={(e) => setForm({ ...form, mobile: e.target.value })}
                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Official Email</label>
                <input
                  type="email"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Website URL</label>
                <input
                  type="text"
                  value={form.website}
                  onChange={(e) => setForm({ ...form, website: e.target.value })}
                  className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500"
                />
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Registered Office Address (Printed in Footer)</label>
              <textarea
                rows="2"
                value={form.address}
                onChange={(e) => setForm({ ...form, address: e.target.value })}
                className="w-full text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500"
              />
            </div>

            <div className="pt-3">
              <button
                onClick={handleSave}
                className="bg-brand-500 hover:bg-brand-600 text-white font-bold px-6 py-2 rounded-lg text-sm transition shadow"
              >
                Save Company Settings
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
